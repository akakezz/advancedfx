name: Open Fortress Material 080 Fixture

on:
  push:
    branches:
      - experiment/of-colored-studio-v080-2026-11-21
  workflow_dispatch:

# Only the newest commit needs the expensive Windows staging build.
concurrency:
  group: of-material080-${{ github.ref }}
  cancel-in-progress: true

jobs:
  of-material080:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify source-extracted studio material and pose fixture
        run: python3 tests/cinematic/test_scene_pose.py --material-only
      - name: AddressSanitizer and UndefinedBehaviorSanitizer
        run: python3 tests/cinematic/test_scene_pose.py --material-only --sanitize

  windows-staging-build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/iron
          check-latest: true
      - uses: MinoruSekine/setup-scoop@v4
      - name: Initialize submodules
        run: git submodule update --init --recursive
      - name: Install gettext
        run: scoop install gettext
      - name: Build staging (same process as main CI)
        run: cmake -DAFX_MULTIBUILD_STAGING=ON -P cmake/MultiBuild.cmake
