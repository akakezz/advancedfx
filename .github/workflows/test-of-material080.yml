name: Open Fortress Material 080 Fixture

on:
  push:
    branches:
      - experiment/of-colored-studio-v080-2026-11-21
  workflow_dispatch:

jobs:
  of-material080:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify source-extracted studio material and pose fixture
        run: python3 tests/cinematic/test_scene_pose.py
      - name: AddressSanitizer and UndefinedBehaviorSanitizer
        run: python3 tests/cinematic/test_scene_pose.py --sanitize
