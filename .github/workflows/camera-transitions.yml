name: Camera transition regressions

on:
  push:
    branches:
      - feature/cinematic-campath
      - feature/scene-cache-2
    paths:
      - 'AfxHookSource/MirvCam.cpp'
      - 'AfxHookSource/CameraOverlay.cpp'
      - 'AfxHookSource/CameraOverlay.h'
      - 'AfxHookSource/CampathDrawer.cpp'
      - 'AfxHookSource/MirvCam.h'
      - 'AfxHookSource/CinematicProject.inl'
      - 'shared/CameraRig.h'
      - 'shared/MusicalTimeline.h'
      - 'shared/overlay/third_party/imgui_neo_sequencer/**'
      - 'shared/RenderResolution.h'
      - 'AfxHookSource/RecordingResolution.h'
      - 'AfxHookSource/RecordingResolution.inl'
      - 'AfxHookSource/AfxStreams.cpp'
      - 'AfxHookSource/d3d9Hooks.cpp'
      - 'AfxHookSource/Gui.cpp'
      - 'AfxHookSource/main.cpp'
      - 'AfxHookSource/MirvCommands.cpp'
      - 'tests/cinematic/**'
      - '.github/workflows/camera-transitions.yml'
  workflow_dispatch:

jobs:
  project-roundtrip-and-blends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check custom mode planning and fitted preview geometry
        run: python3 tests/cinematic/test_recording_resolution.py
      - name: Check generic renderable capture and native replay fixtures
        if: github.ref == 'refs/heads/feature/scene-cache-2'
        run: python3 tests/cinematic/test_scene_pose.py --build-dir /tmp/hlae-scene-pose-tests
      - name: Check project persistence, overlapping transitions, Bezier and frozen poses
        run: python3 tests/cinematic/test_camera_project.py --build-dir /tmp/hlae-camera-transition-tests

  overlay-interaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check musical timeline timebase and snapping
        run: python3 tests/cinematic/test_musical_timeline.py
      - name: Check independent clip gestures and fade styling
        run: python3 tests/cinematic/test_clip_gestures.py
      - name: Fetch pinned Dear ImGui used by the cinematic overlay
        run: git clone --depth 1 --branch v1.89.9-docking https://github.com/ocornut/imgui.git /tmp/imgui-docking
      - name: Compile and exercise headless sequencer/Bezier overlay
        run: python3 tests/cinematic/test_overlay.py --imgui-dir /tmp/imgui-docking --build-dir /tmp/hlae-transition-overlay
